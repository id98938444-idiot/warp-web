<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<h3>Link WARP</h3>
<textarea id="o" rows="8" style="width:100%" readonly>Đang tạo...</textarea>
<button id="c">Sao chép</button>
<script>
(async () => {
  try {
    const r = await fetch("/api/warp", { method: "POST" });
    o.value = r.status === 429
      ? "Đợi 1 phút rồi refresh"
      : await r.text();
  } catch { o.value = "Lỗi mạng"; }
})();
c.onclick = async () => {
  await navigator.clipboard.writeText(o.value);
  c.textContent = "Đã chép";
};
</script>
